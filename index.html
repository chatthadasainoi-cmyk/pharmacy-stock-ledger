<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>สมุดคลังยา</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0B6E55">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 22 22"><g fill="currentColor"><rect x="2" y="4" width="2" height="14"/><rect x="5.5" y="4" width="1" height="14"/><rect x="8" y="4" width="3" height="14"/><rect x="12.5" y="4" width="1" height="14"/><rect x="15" y="4" width="2" height="14"/><rect x="18.5" y="4" width="1.5" height="14"/></g></svg>
      </div>
      <div><div class="brand-name">สมุดคลังยา</div><div class="brand-shop" id="shopName">ร้านยาของฉัน</div></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="rail-foot"><span class="dot" id="storeDot"></span><span id="storeText">กำลังเชื่อมต่อข้อมูล…</span></div>
  </aside>

  <div class="main">
    <header class="scanbar">
      <form class="scanrow" id="scanForm" autocomplete="off">
        <div class="scanfield">
          <span class="mode" id="modeBadge">ดูข้อมูล</span>
          <input id="scanInput" type="text" enterkeyhint="go" spellcheck="false" placeholder="สแกนบาร์โค้ด หรือพิมพ์ชื่อ / SKU" aria-label="ช่องสแกนบาร์โค้ด">
          <div class="suggest" id="suggest" hidden></div>
        </div>
        <button type="button" class="scan-btn" data-action="camera-open" title="สแกนด้วยกล้อง">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 8v8M10 8v8M13.5 8v8M17 8v8"/></svg><span class="t">กล้อง</span>
        </button>
        <label class="scan-btn" title="ถ่ายรูปบาร์โค้ดแล้วอ่าน">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h3l2-3h6l2 3h3a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/></svg><span class="t">ถ่ายรูป</span>
          <input type="file" accept="image/*" capture="environment" id="photoInput" hidden>
        </label>
        <button type="button" class="scan-btn help-btn" data-action="tour" title="คู่มือการใช้งาน" aria-label="คู่มือการใช้งาน">?</button>
      </form>
      <div class="scanhint"><span class="live"><span class="dot on"></span>พร้อมรับจากเครื่องสแกน USB</span><span id="scanHint"></span></div>
    </header>
    <div id="banner"></div>
    <main class="view" id="view"><div class="empty">กำลังโหลดข้อมูล…</div></main>
  </div>
  <nav class="tabbar" id="tabbar"></nav>
</div>

<div id="drawerRoot"></div>
<div id="modalRoot"></div>
<div class="camera" id="camera" hidden>
  <div class="cam-bar">
    <select id="camSelect" aria-label="เลือกกล้อง" hidden></select>
    <button class="btn" data-action="torch" id="torchBtn" hidden>ไฟฉาย</button>
    <button class="btn" data-action="camera-close" style="margin-left:auto">ปิดกล้อง</button>
  </div>
  <div id="reader"></div>
  <label class="cam-zoom" id="zoomRow" hidden><span>ซูม</span><input type="range" id="zoomRange" min="1" max="4" step="0.1" value="1"><span class="mono" id="zoomVal">1×</span></label>
  <p id="camMsg">กำลังเปิดกล้อง…</p>
</div>
<div id="tour" hidden></div>
<div id="fileReaderBox" hidden></div>
<input type="file" id="importInput" accept="application/json,.json" hidden>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="gate" id="gate" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="config.js"></script>
<script src="js/core.js"></script>
<script src="js/views.js"></script>
<script src="js/import.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
