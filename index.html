<title>สมุดคลังยา</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
:root{
  --ground:#EFF2EF; --surface:#FFFFFF; --sunken:#E5EAE6; --ink:#15201C; --muted:#5B6863; --faint:#88948F;
  --line:#D6DDD8; --line-strong:#B8C2BC;
  --accent:#0B6E55; --accent-strong:#085843; --accent-ink:#FFFFFF; --accent-soft:#D8ECE4;
  --stamp:#443C96; --stamp-soft:#E8E6F6;
  --crit:#B42318; --crit-soft:#FBE3E0; --warn:#955800; --warn-soft:#FAEBCF; --low:#1F5A94; --low-soft:#DDE8F5; --ok:#2B7549; --ok-soft:#DCEFE2;
  --scrim:rgba(14,24,20,.42); --shadow:0 18px 48px rgba(16,36,28,.18);
  --font-body:"IBM Plex Sans Thai","Noto Sans Thai","Leelawadee UI",Tahoma,sans-serif;
  --font-display:"Bai Jamjuree","IBM Plex Sans Thai","Leelawadee UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0E1412; --surface:#151D1A; --sunken:#1B2521; --ink:#E3EAE6; --muted:#98A69F; --faint:#6E7C76;
    --line:#25302C; --line-strong:#374540;
    --accent:#3DBB91; --accent-strong:#62CFA9; --accent-ink:#06231A; --accent-soft:#173A2F;
    --stamp:#ADA6F2; --stamp-soft:#26233F;
    --crit:#F28B7F; --crit-soft:#3A1D1A; --warn:#E3A84D; --warn-soft:#36280F; --low:#86B8EC; --low-soft:#172A3E; --ok:#78C99A; --ok-soft:#173222;
    --scrim:rgba(0,0,0,.6); --shadow:0 18px 48px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --ground:#0E1412; --surface:#151D1A; --sunken:#1B2521; --ink:#E3EAE6; --muted:#98A69F; --faint:#6E7C76;
  --line:#25302C; --line-strong:#374540;
  --accent:#3DBB91; --accent-strong:#62CFA9; --accent-ink:#06231A; --accent-soft:#173A2F;
  --stamp:#ADA6F2; --stamp-soft:#26233F;
  --crit:#F28B7F; --crit-soft:#3A1D1A; --warn:#E3A84D; --warn-soft:#36280F; --low:#86B8EC; --low-soft:#172A3E; --ok:#78C99A; --ok-soft:#173222;
  --scrim:rgba(0,0,0,.6); --shadow:0 18px 48px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{background:var(--ground)}
body{margin:0;color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:var(--ink)}
h1,h2,h3{font-family:var(--font-display);margin:0;line-height:1.25;text-wrap:balance}
h1{font-size:26px;font-weight:600}
h2{font-size:17px;font-weight:600}
h3{font-size:15px;font-weight:600}
p{margin:0}
.mono{font-family:var(--font-mono)}
.tnum,.mono,td,.fig-v{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:228px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px;padding:18px 12px;border-right:1px solid var(--line);background:var(--surface)}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px}
.brand-mark{width:36px;height:36px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.brand-name{font-family:var(--font-display);font-weight:700;font-size:18px;line-height:1.15}
.brand-shop{font-size:12px;color:var(--muted);line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;padding:9px 12px;border:0;border-radius:6px;background:transparent;color:var(--muted);font-weight:500;text-align:left;cursor:pointer}
.nav button:hover{background:var(--sunken);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent-strong);font-weight:600}
.nav .count{margin-left:auto;font-family:var(--font-mono);font-size:12px;background:var(--crit-soft);color:var(--crit);border-radius:999px;padding:0 7px}
.rail-foot{margin-top:auto;padding:10px 12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:flex-start}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none;margin-top:6px}
.dot.on{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.main{min-width:0;display:flex;flex-direction:column}

.scanbar{position:sticky;top:0;z-index:30;padding:14px 28px 12px;background:var(--ground);border-bottom:1px solid var(--line)}
.scanrow{display:flex;gap:10px;align-items:stretch;max-width:1240px}
.scanfield{position:relative;flex:1;min-width:0;display:flex;align-items:stretch;background:var(--surface);border:1.5px solid var(--line-strong);border-radius:8px;height:52px}
.scanfield:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.mode{display:flex;align-items:center;gap:8px;padding:0 14px;margin:4px;border-radius:5px;background:var(--accent);color:var(--accent-ink);font-family:var(--font-display);font-weight:600;font-size:14px;white-space:nowrap}
#scanInput{flex:1;min-width:0;border:0;background:transparent;font-family:var(--font-mono);font-size:17px;padding:0 10px;outline:none}
#scanInput::placeholder{font-family:var(--font-body);font-size:15px;color:var(--faint)}
.scan-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 16px;border:1.5px solid var(--line-strong);border-radius:8px;background:var(--surface);cursor:pointer;font-weight:500;white-space:nowrap}
.scan-btn:hover{border-color:var(--accent);color:var(--accent-strong)}
.scanhint{display:flex;gap:14px;align-items:center;margin-top:7px;font-size:12.5px;color:var(--muted);max-width:1240px;flex-wrap:wrap}
.scanhint .live{display:inline-flex;align-items:center;gap:6px}
.scanhint .live .dot{margin:0}
.suggest{position:absolute;left:-1.5px;right:-1.5px;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;box-shadow:var(--shadow);overflow:hidden;z-index:40}
.suggest button{display:flex;width:100%;gap:12px;align-items:baseline;padding:10px 14px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;cursor:pointer}
.suggest button:first-child{border-top:0}
.suggest button:hover,.suggest button.sel{background:var(--accent-soft)}

.view{padding:22px 28px 90px;width:100%;max-width:1296px}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.page-h p{color:var(--muted);margin-top:2px}
.sec{margin-top:26px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}

.banner{display:flex;gap:10px 16px;align-items:center;flex-wrap:wrap;margin:14px 28px 0;max-width:1240px;padding:10px 14px;border:1px dashed var(--stamp);border-radius:8px;background:var(--stamp-soft);color:var(--ink);font-size:13.5px}
.banner b{color:var(--stamp)}
.banner .grow{flex:1;min-width:220px}
.demo-chip{border:1px solid var(--stamp);background:var(--surface);color:var(--stamp);border-radius:999px;padding:3px 11px;font-size:13px;cursor:pointer}
.demo-chip:hover{background:var(--stamp);color:var(--surface)}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 14px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);font-weight:500;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{background:var(--accent-strong);border-color:var(--accent-strong)}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--sunken)}
.btn.sm{height:30px;padding:0 10px;font-size:13px}
.btn.lg{height:48px;font-size:16px;padding:0 20px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{display:inline-grid;place-items:center;width:32px;height:32px;border:0;border-radius:6px;background:transparent;color:var(--muted);cursor:pointer}
.icon-btn:hover{background:var(--sunken);color:var(--ink)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.label{font-size:13px;color:var(--muted);font-weight:500}
.field .help{font-size:12px;color:var(--faint)}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{width:100%;height:40px;padding:0 10px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface)}
textarea{height:auto;padding:8px 10px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input.mono{font-family:var(--font-mono)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:0 12px;height:34px;cursor:pointer;color:var(--muted);font-size:13.5px;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--ground);font-weight:600}

/* ---------- data atoms ---------- */
.lotchip{display:inline-flex;gap:9px;align-items:baseline;font-family:var(--font-mono);font-size:12px;color:var(--stamp);background:var(--stamp-soft);padding:1px 8px;border-radius:3px;white-space:nowrap;letter-spacing:.02em}
.lotchip b{font-weight:600}
.lotchip.crit{color:var(--crit);background:var(--crit-soft)}
.lotchip.warn{color:var(--warn);background:var(--warn-soft)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:1px 9px;border-radius:999px;white-space:nowrap;background:var(--sunken);color:var(--muted)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.low{background:var(--low-soft);color:var(--low)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.in{background:var(--ok-soft);color:var(--ok)}
.pill.out{background:var(--sunken);color:var(--ink)}
.pill.adj{background:var(--low-soft);color:var(--low)}
.cat{font-size:12px;color:var(--muted);white-space:nowrap}
.cat.ctrl{color:var(--crit);font-weight:600}
.qty-plus{color:var(--ok)} .qty-minus{color:var(--ink)}
.name{font-weight:600}
.sub{color:var(--muted);font-size:13px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table{width:100%;border-collapse:collapse}
th{font-size:12.5px;font-weight:500;color:var(--muted);text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--sunken)}
td.r,th.r{text-align:right}
.empty{padding:34px 20px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);margin-bottom:4px}

/* ---------- home ---------- */
.figs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:8px}
.fig{padding:14px 18px;border-left:1px solid var(--line)}
.fig:first-child{border-left:0}
.fig-v{font-family:var(--font-display);font-size:26px;font-weight:600;line-height:1.2}
.fig-k{font-size:13px;color:var(--muted)}
.fig-v.crit{color:var(--crit)}
.home-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:28px;align-items:start}
.rows>.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;width:100%;padding:11px 14px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;cursor:pointer}
.rows>.row:first-child{border-top:0}
.rows>.row:hover{background:var(--sunken)}
.row .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:2px}
.row .end{text-align:right;font-size:13px}
.chart svg{display:block;width:100%;height:auto}
.chart .bar{fill:var(--accent);opacity:.5}
.chart .bar.today{opacity:1}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--muted);font-family:var(--font-mono);font-size:11px}
.chart .val{fill:var(--ink);font-family:var(--font-mono);font-size:12px;font-weight:600}
.feed .item{display:grid;grid-template-columns:48px auto minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:9px 14px;border-top:1px solid var(--line)}
.feed .item:first-child{border-top:0}

/* ---------- sale ---------- */
.sale-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:22px;align-items:start}
.bline{display:grid;grid-template-columns:minmax(0,1fr) 110px 128px 96px 32px;gap:12px;align-items:center;padding:13px 14px;border-top:1px solid var(--line)}
.bline:first-child{border-top:0}
.picks{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px;align-items:center}
.stepper{display:grid;grid-template-columns:34px minmax(0,1fr) 34px;border:1px solid var(--line-strong);border-radius:6px;overflow:hidden;height:38px;background:var(--surface)}
.stepper button{border:0;background:var(--sunken);cursor:pointer;font-size:18px;line-height:1}
.stepper input{border:0;border-radius:0;height:100%;text-align:center;padding:0;font-family:var(--font-mono);-moz-appearance:textfield}
.stepper input:focus{box-shadow:none}
.stepper input::-webkit-inner-spin-button{-webkit-appearance:none}
.bprice{text-align:right;font-family:var(--font-mono);font-weight:600}
.summary{position:sticky;top:120px;padding:18px;display:flex;flex-direction:column;gap:14px}
.total{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);padding-top:12px}
.total .v{font-family:var(--font-display);font-size:32px;font-weight:600;font-variant-numeric:tabular-nums}

/* ---------- receive ---------- */
.rc-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start}
.rc-form{padding:20px;display:flex;flex-direction:column;gap:16px}
.picked{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:6px;background:var(--sunken)}
.placeholder{padding:26px 18px;border:1.5px dashed var(--line-strong);border-radius:8px;text-align:center;color:var(--muted)}
.gs1note{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;color:var(--stamp)}

/* ---------- filters ---------- */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
.filters .field{width:auto}
.filters input[type=search]{width:240px}
.filters input[type=date]{width:160px}
.filters select{width:190px}
.sumline{display:flex;gap:18px;flex-wrap:wrap;font-size:13.5px;color:var(--muted);margin:0 0 10px}
.sumline b{color:var(--ink);font-family:var(--font-mono)}

/* ---------- drawer / modal ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:60}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(600px,100%);background:var(--surface);z-index:61;box-shadow:var(--shadow);display:flex;flex-direction:column}
.drawer-h{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:18px 20px 14px;border-bottom:1px solid var(--line)}
.drawer-b{overflow-y:auto;padding:16px 20px 40px;display:flex;flex-direction:column;gap:22px}
.drawer-f{display:flex;gap:10px;justify-content:flex-end;padding:12px 20px;border-top:1px solid var(--line);background:var(--surface)}
.kv{display:grid;grid-template-columns:130px minmax(0,1fr);gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.editrows{display:flex;flex-direction:column;gap:8px}
.editrow{display:grid;gap:8px;align-items:center}
.editrow.units{grid-template-columns:minmax(0,1fr) 110px 110px 32px}
.editrow.codes{grid-template-columns:minmax(0,1fr) 130px 32px}
.modal-wrap{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:16px}
.modal{position:relative;width:min(460px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--surface);border-radius:10px;box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:14px}
.modal .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
.label-sheet{background:#fff;color:#000;border:1px solid #ccc;border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;align-items:center}
.label-sheet .ln{font-family:"IBM Plex Sans Thai",sans-serif;font-weight:600;font-size:14px;text-align:center}
.label-sheet .lp{font-family:"IBM Plex Mono",monospace;font-size:13px}
.label-sheet svg{width:240px;height:auto}

.camera{position:fixed;inset:0;z-index:80;background:#0A0F0D;color:#E6ECE9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px}
#reader{width:min(560px,100%);border-radius:10px;overflow:hidden;background:#000;min-height:220px}
#reader video{display:block}
.camera p{max-width:480px;text-align:center;color:#B9C6C0;margin:0}
.camera .btn{background:#1B2521;color:#E6ECE9;border-color:#374540}
.cam-bar{display:flex;gap:8px;width:min(560px,100%);align-items:center}
.cam-bar select{width:auto;max-width:60%;background:#1B2521;color:#E6ECE9;border-color:#374540}
.cam-zoom{display:flex;align-items:center;gap:12px;width:min(560px,100%);color:#E6ECE9;font-size:14px}
.cam-zoom input{flex:1;accent-color:#3DBB91}

.help-btn{width:52px;padding:0;font-family:var(--font-display);font-size:20px;font-weight:700;color:var(--accent-strong)}
.onboard{padding:18px 20px;margin-bottom:22px;display:flex;flex-direction:column;gap:12px}
.onboard ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.onboard li{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.onboard li:first-child{border-top:0}
.onboard .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-mono);font-size:13px;font-weight:600;background:var(--sunken);color:var(--muted)}
.onboard li.done .n{background:var(--ok);color:var(--surface)}
.onboard li.done .t{color:var(--muted);text-decoration:line-through}
.onboard .t{font-weight:600}

#tour{position:fixed;inset:0;z-index:88}
.tour-hole{position:fixed;border-radius:10px;box-shadow:0 0 0 9999px rgba(6,12,10,.62);pointer-events:none;transition:left .2s,top .2s,width .2s,height .2s}
.tour-dim{position:fixed;inset:0;background:rgba(6,12,10,.62)}
.tour-card{position:fixed;background:var(--surface);color:var(--ink);border-radius:10px;box-shadow:var(--shadow);padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.tour-card p{color:var(--muted);font-size:14.5px}
.tour-step{font-family:var(--font-mono);font-size:12px;color:var(--accent-strong)}
.tour-foot{display:flex;gap:8px;align-items:center;margin-top:6px}
@media (prefers-reduced-motion: reduce){.tour-hole{transition:none}}

.toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(520px,calc(100% - 24px))}
.toast{background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:8px;box-shadow:var(--shadow);font-size:14px;animation:tin .18s ease-out}
.toast.err{background:var(--crit);color:#fff}
@keyframes tin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.toast{animation:none}}

  { id: 'settings', label: 'ตั้งค่า', icon: 'settings', mode: 'ดูข้อมูล', hint: 'สแกนเพื่อดูข้อมูลยา' },
];

/* ================= state ================= */
const S = {
  ready: { products: false, moves: false },
  products: {}, days: {}, meta: {},
  page: 'home',
  basket: [], saleNote: '',
  receive: { pid: null, kind: 'receive', lot: '', exp: '', qty: '', unit: '', cost: '', note: '', fromScan: false },

const settings = () => Object.assign({ shopName: 'ร้านยาของฉัน', nearDays: 90 }, S.meta.settings || {});

/* ================= storage ================= */
async function getCap(name) {
  try { return (window.claude && typeof window.claude.use === 'function') ? await window.claude.use(name) : null; }
  catch (e) { return null; }
}
function dbStore(db) {
  return {
    kind: 'db',
    watch(col, cb) {
      return db.collection(col).onSnapshot(s => {
        const out = {}; s.docs.forEach(d => { if (d.exists) out[d.id] = d.data(); }); cb(out);
      }, e => toast('การเชื่อมต่อข้อมูลขัดข้อง: ' + (e.message || e.code) + ' — ลองรีโหลดหน้า', 'err'));
    },
    set: (col, id, data) => db.doc(col + '/' + id).set(data),
    update: (col, id, data) => db.doc(col + '/' + id).update(data),
    del: (col, id) => db.doc(col + '/' + id).delete(),
    async addEntries(day, entries) {
      const ref = db.doc('moves/' + day); const snap = await ref.get();
      if (snap.exists) await ref.update({ entries }); else await ref.set({ date: day, entries });
    },
  };
}
function localStore() {
  const KEY = 'samut-khlang-ya:v1';
  let data = { products: {}, moves: {}, meta: {} };
  try { const raw = localStorage.getItem(KEY); if (raw) data = Object.assign(data, JSON.parse(raw)); } catch (e) { /* storage blocked */ }
  const subs = {};
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { toast('บันทึกลงเบราว์เซอร์ไม่สำเร็จ — พื้นที่อาจเต็ม ให้สำรองข้อมูลเป็นไฟล์', 'err'); } };
  const emit = col => (subs[col] || []).forEach(cb => cb(clone(data[col] || {})));
  const merge = (a, b) => { for (const k of Object.keys(b)) { const v = b[k]; if (v && typeof v === 'object' && !Array.isArray(v) && a[k] && typeof a[k] === 'object' && !Array.isArray(a[k])) merge(a[k], v); else a[k] = v; } return a; };
  return {
    kind: 'local',
    watch(col, cb) { (subs[col] = subs[col] || []).push(cb); setTimeout(() => cb(clone(data[col] || {})), 0); return () => {}; },
    async set(col, id, doc) { (data[col] = data[col] || {})[id] = clone(doc); save(); emit(col); },
    async update(col, id, part) { data[col] = data[col] || {}; data[col][id] = merge(data[col][id] || {}, clone(part)); save(); emit(col); },
    async del(col, id) { if (data[col]) delete data[col][id]; save(); emit(col); },
    async addEntries(day, entries) { data.moves[day] = merge(data.moves[day] || { date: day, entries: {} }, { entries: clone(entries) }); save(); emit('moves'); },
  };
}
function loadScript(src) {
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('โหลด ' + src + ' ไม่สำเร็จ')); document.head.appendChild(s); });
}
const BRAND = `<div class="brand"><div class="brand-mark" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 22 22"><g fill="currentColor"><rect x="2" y="4" width="2" height="14"/><rect x="5.5" y="4" width="1" height="14"/><rect x="8" y="4" width="3" height="14"/><rect x="12.5" y="4" width="1" height="14"/><rect x="15" y="4" width="2" height="14"/><rect x="18.5" y="4" width="1.5" height="14"/></g></svg></div><div class="brand-name">สมุดคลังยา</div></div>`;
function showGate(inner) { const g = $('#gate'); g.innerHTML = `<div class="gate-card">${BRAND}${inner}</div>`; g.hidden = false; }
function hideGate() { $('#gate').hidden = true; $('#gate').innerHTML = ''; }
// Firebase (Firestore + Google sign-in). Writes are fired without awaiting the server so the
// counter keeps working offline; Firestore applies them locally at once and syncs later.
async function firebaseStore(cfg) {
  const base = 'https://www.gstatic.com/firebasejs/10.14.1/';
  await loadScript(base + 'firebase-app-compat.js');
  await loadScript(base + 'firebase-auth-compat.js');
  await loadScript(base + 'firebase-firestore-compat.js');
  const fb = window.firebase;
  if (!fb.apps.length) fb.initializeApp(cfg.firebase);
  const auth = fb.auth(), fs = fb.firestore();
  try { fs.settings({ ignoreUndefinedProperties: true, merge: true }); } catch (e) { /* settings already applied */ }
  try { await fs.enablePersistence({ synchronizeTabs: true }); } catch (e) { /* private window or unsupported: online only */ }
  const user = await new Promise(res => { const un = auth.onAuthStateChanged(u => { un(); res(u); }); });
  if (!user) {
    showGate(`<h2>เข้าสู่ระบบ</h2><p>ใช้บัญชี Google ที่ได้รับสิทธิ์เข้าร้านนี้ ข้อมูลจะซิงก์ทุกเครื่องที่ล็อกอินบัญชีเดียวกัน</p>
      <button class="btn primary lg" id="gateLogin">เข้าสู่ระบบด้วย Google</button><p class="small" id="gateMsg"></p>`);
    $('#gateLogin').addEventListener('click', async () => {
      const provider = new fb.auth.GoogleAuthProvider(); provider.setCustomParameters({ prompt: 'select_account' });
      $('#gateMsg').textContent = '';
      try { await auth.signInWithPopup(provider); location.reload(); }
      catch (e) {
        if (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment') return auth.signInWithRedirect(provider);
        if (e.code === 'auth/popup-closed-by-user' || e.code === 'auth/cancelled-popup-request') return;
        $('#gateMsg').textContent = e.code === 'auth/unauthorized-domain'
          ? `โดเมน ${location.hostname} ยังไม่ได้เพิ่มใน Firebase → Authentication → Settings → Authorized domains`
          : 'เข้าสู่ระบบไม่สำเร็จ: ' + (e.message || e.code);
      }
    });
    return null;
  }
  const root = 'shops/' + (cfg.shopId || 'main');
  const denied = () => {
    showGate(`<h2>ฐานข้อมูลยังไม่อนุญาตให้เข้า</h2><p>ล็อกอินเป็น <b class="mono">${esc(user.email)}</b> แล้ว แต่ Firestore ปฏิเสธการอ่านข้อมูล — ตรวจว่าวาง Rules ใน Firebase console แล้วกด Publish (รอประมาณ 1 นาทีให้มีผล)</p>
      <button class="btn primary" onclick="location.reload()">ลองอีกครั้ง</button>
      <button class="btn" id="gateOut">ออกจากระบบแล้วใช้บัญชีอื่น</button>`);
    $('#gateOut').addEventListener('click', () => auth.signOut().then(() => location.reload()));
  };

  catch (e) { if (e.code === 'permission-denied') { denied(); return null; } }

  return {
    kind: 'firebase', email: user.email,
    watch(col, cb) {
      return fs.collection(root + '/' + col).onSnapshot(s => { const out = {}; s.forEach(d => { out[d.id] = d.data(); }); cb(out); },
        e => { if (e.code === 'permission-denied') denied(); else toast('การเชื่อมต่อข้อมูลขัดข้อง: ' + (e.message || e.code), 'err'); });
    },
    set: (col, id, data) => fire(fs.doc(`${root}/${col}/${id}`).set(data)),
    update: (col, id, data) => fire(fs.doc(`${root}/${col}/${id}`).set(data, { merge: true })),
    del: (col, id) => fire(fs.doc(`${root}/${col}/${id}`).delete()),
    addEntries: (day, entries) => fire(fs.doc(`${root}/moves/${day}`).set({ date: day, entries }, { merge: true })),
    signOut: () => auth.signOut().then(() => location.reload()),
  };
}
let Store = null;

/* ================= derived data ================= */
function compute() {
  const moves = [];

  D = { moves, lotQty, pQty, codeIndex };
}
const unitsOf = p => ((p && p.units && p.units.length) ? p.units : [{ name: 'หน่วย', size: 1, price: 0 }]).slice().sort((a, b) => a.size - b.size);
const unitByName = (p, n) => unitsOf(p).find(u => u.name === n) || unitsOf(p)[0];

function salesChart() {
  const days = []; for (let i = 13; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); days.push(d); }
  const keys = days.map(dayKey); const sums = Object.fromEntries(keys.map(k => [k, 0]));
  for (const m of D.moves) { const k = dayKey(new Date(m.at)); if (k in sums) { if (m.type === 'sale') sums[k] += m.amount || 0; if (m.type === 'void') sums[k] -= m.amount || 0; } }
  const vals = keys.map(k => Math.max(0, sums[k]));
  const mx = Math.max(...vals, 1); const e = Math.pow(10, Math.floor(Math.log10(mx))); const f = mx / e;
  const top = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * e;
  const W = 560, H = 190, L = 54, Rp = 8, T = 22, B = 24, cw = (W - L - Rp) / 14, bw = cw * 0.6, ch = H - T - B;
  const y = v => T + (1 - v / top) * ch;
  let g = '';
  [0, top / 2, top].forEach(v => { g += `<line class="grid" x1="${L}" x2="${W - Rp}" y1="${y(v)}" y2="${y(v)}"/><text class="axis" x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${baht(v)}</text>`; });
  vals.forEach((v, i) => {
    const x = L + i * cw + (cw - bw) / 2, h = Math.max(v > 0 ? 2 : 0, (v / top) * ch);
    g += `<rect class="bar${i === 13 ? ' today' : ''}" x="${x}" y="${T + ch - h}" width="${bw}" height="${h}" rx="2"><title>${fmtDate(days[i].toISOString())}: ${baht(v)}</title></rect>`;
    if (i % 2 === 1 || i === 13) g += `<text class="axis" x="${x + bw / 2}" y="${H - 6}" text-anchor="middle">${i === 13 ? 'วันนี้' : days[i].getDate()}</text>`;
  });
  g += `<text class="val" x="${L + 13 * cw + cw / 2}" y="${y(vals[13]) - 7}" text-anchor="end">${baht(vals[13])}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="กราฟยอดขาย 14 วัน">${g}</svg>`;
}

function addToBasket(pid, unit, lotPref) {
  const p = S.products[pid];

  const ex = S.basket.find(b => b.pid === pid && b.unit === u.name && (b.lotPref || null) === (lotPref || null));
  if (ex) ex.qty++; else S.basket.push({ pid, unit: u.name, qty: 1, lotPref: lotPref || null });
}
async function commitSale() {
  const lines = basketCalc();

  const tk = todayKey(); const seq = new Set(D.moves.filter(m => m.bill && m.bill.startsWith('B' + tk.replace(/-/g, '').slice(2))).map(m => m.bill)).size + 1;
  const bill = `B${tk.replace(/-/g, '').slice(2)}-${pad(seq)}`;
  const at = new Date().toISOString(); const entries = [];
  for (const { ln, p, u, al } of lines) for (const pk of al.picks) {
    const unitQty = pk.take / u.size;
    entries.push({ id: uid('m'), at, type: 'sale', pid: ln.pid, lotId: pk.lot.id, qty: -pk.take, unit: u.name, unitQty, unitPrice: u.price || 0, amount: unitQty * (u.price || 0), bill, note: S.saleNote.trim() });
  }
  await record(entries);
  const total = lines.reduce((s, l) => s + l.price, 0);
  S.basket = []; S.saleNote = '';
  toast(`บันทึกบิล ${bill} แล้ว · ${baht(total)}`); render();
}

function startReceive(pid, r, unit) {
  const p = S.products[pid]; const prev = S.receive;

  S.receive = { pid, kind: prev.kind || 'receive', lot: (r && r.lot) || '', exp, qty: '', unit: unit || us[us.length - 1].name, cost: '', note: prev.note || '', fromScan: !!(r && (r.lot || r.exp)) };
  S.page = 'receive'; render();
  const el = document.getElementById(S.receive.lot && S.receive.exp ? 'rc-qty' : 'rc-lot'); if (el) el.focus();
}
async function commitReceive() {
  const R = S.receive; const p = S.products[R.pid];
  if (!p) return toast('สแกนหรือเลือกยาที่จะรับเข้าก่อน', 'err');
  const lot = (R.lot || '').trim().toUpperCase();
  const bad = (id, msg) => { toast(msg, 'err'); const el = document.getElementById(id); if (el) el.focus(); };
  if (!lot) return bad('rc-lot', 'กรอกเลขล็อต (LOT) ตามที่พิมพ์บนกล่อง');
  if (!/^\d{4}-\d{2}-\d{2}$/.test(R.exp)) return bad('rc-exp', 'ใส่วันหมดอายุ (EXP) ตามที่พิมพ์บนกล่อง');
  const qty = Number(R.qty); if (!(qty > 0)) return bad('rc-qty', 'ใส่จำนวนที่รับมากกว่า 0');
  const u = unitByName(p, R.unit); const cost = Number(R.cost) || 0; const at = new Date().toISOString();
  let lotId = Object.keys(p.lots || {}).find(id => p.lots[id].lot.toUpperCase() === lot);
  if (!lotId) { lotId = uid('l'); await Store.update('products', R.pid, { lots: { [lotId]: { lot, exp: R.exp, addedAt: at } } }); }
  else if (p.lots[lotId].exp !== R.exp) await Store.update('products', R.pid, { lots: { [lotId]: { exp: R.exp } } });
  await record([{ id: uid('m'), at, type: R.kind, pid: R.pid, lotId, qty: qty * u.size, unit: u.name, unitQty: qty, unitPrice: cost, amount: cost * qty, note: (R.note || '').trim() }]);
  toast(`รับ ${p.name} ${qty} ${u.name} (LOT ${lot}) แล้ว`);
  S.receive = { pid: null, kind: R.kind, lot: '', exp: '', qty: '', unit: '', cost: '', note: R.note, fromScan: false };
  render(); $('#scanInput').focus();
}

async function saveProduct() {
  const dr = S.drawer; const d = dr.draft;
  const name = d.name.trim(); if (!name) { toast('ใส่ชื่อยา', 'err'); $('#pd-name').focus(); return; }
  const units = d.units.map(u => ({ name: String(u.name).trim(), size: Number(u.size), price: Number(u.price) || 0 })).filter(u => u.name);
  if (!units.length) return toast('ต้องมีหน่วยนับอย่างน้อย 1 หน่วย', 'err');
  units[0].size = 1;
  if (units.some(u => !(u.size >= 1))) return toast('ขนาดหน่วยต้องเป็นตัวเลขตั้งแต่ 1 ขึ้นไป', 'err');
  if (new Set(units.map(u => u.name)).size !== units.length) return toast('ชื่อหน่วยซ้ำกัน', 'err');
  const codes = {};
  for (const c of d.codes) {
    const code = normCode(c.code || ''); if (!code) continue;
    const hit = D.codeIndex[code]; if (hit && hit.pid !== dr.pid) return toast(`บาร์โค้ด ${code} เป็นของ ${S.products[hit.pid].name} อยู่แล้ว`, 'err');
    codes[code] = units.some(u => u.name === c.unit) ? c.unit : units[0].name;
  }
  const pid = dr.pid || uid('p');
  const prev = dr.pid ? S.products[dr.pid] : {};
  const doc = Object.assign(clone(prev) || {}, { name, generic: d.generic.trim(), strength: d.strength.trim(), form: d.form, cat: d.cat, regNo: d.regNo.trim(), reorder: Number(d.reorder) || 0, units, codes, lots: clone(prev.lots) || {} });
  delete doc.sample;
  if (prev.sample) doc.sample = true;
  await Store.set('products', pid, doc);
  S.products[pid] = doc; compute();
  const scan = dr.scan;
  toast(dr.pid ? 'บันทึกการแก้ไขแล้ว' : `เพิ่ม ${name} แล้ว`);
  if (!dr.pid && (scan || S.page === 'receive' || S.page === 'sale')) {
    S.drawer = null;
    if (S.page === 'sale') toast('ยาใหม่ยังไม่มีสต็อก — รับยาเข้าก่อนขาย');
    const hit = scan && D.codeIndex[scan.key];
    startReceive(pid, scan, hit && hit.unit);
  } else { S.drawer = { mode: 'view', pid }; render(); }
}

function handleScan(raw) {

  if (hit) return actOnProduct(hit.pid, r, hit.unit);
  const ids = searchProducts(raw);
  if (ids.length && (!r || r.kind === 'code')) return actOnProduct(ids[0], null, null);
  if (r) return openNewProduct(r);
  toast(`ไม่พบยา “${raw}” — ลองพิมพ์ชื่ออื่น หรือกดเพิ่มยาใหม่ในหน้าคลังยา`, 'err');
}
function actOnProduct(pid, r, unit) {

}

let cam = null, camDone = false, camCaps = null;

function csv(rows) { return '﻿' + rows.map(r => r.map(v => { const s = String(v ?? ''); return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(',')).join('\r\n'); }
async function saveFile(filename, data, mime) {

  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], { type: mime })); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}
function exportCSV(moves, name) {
  const head = ['วันที่', 'เวลา', 'รายการ', 'ชื่อยา', 'ชื่อสามัญ', 'ความแรง', 'ประเภทยา', 'เลขทะเบียน', 'LOT', 'EXP', 'จำนวน', 'หน่วย', 'จำนวน(หน่วยเล็กสุด)', 'ราคาต่อหน่วย', 'จำนวนเงิน', 'เลขบิล', 'หมายเหตุ'];
  const rows = moves.slice().reverse().map(m => { const p = S.products[m.pid] || {}; const l = (p.lots || {})[m.lotId] || {};
    return [dayKey(new Date(m.at)), fmtTime(m.at), TYPES[m.type].label, p.name, p.generic, p.strength, p.cat, p.regNo, l.lot, l.exp, (m.qty > 0 ? '' : '-') + trimNum(Math.abs(m.unitQty || 0)), m.unit, m.qty, m.unitPrice, trimNum(m.amount || 0), m.bill, m.note]; });

  'new-product'() { openNewProduct(null); },
  'edit-product'() { const p = S.products[S.drawer.pid]; const us = unitsOf(p);
    S.drawer = { mode: 'edit', pid: S.drawer.pid, draft: { name: p.name || '', generic: p.generic || '', strength: p.strength || '', form: p.form || 'เม็ด', cat: p.cat || CATS[1], regNo: p.regNo || '', reorder: p.reorder || '', units: us.map(u => ({ ...u })), codes: Object.entries(p.codes || {}).map(([code, unit]) => ({ code, unit })) } }; render(); },
  'cancel-edit'() { S.drawer = { mode: 'view', pid: S.drawer.pid }; render(); },
  'drawer-sell'() { const pid = S.drawer.pid; addToBasket(pid, null, null); S.drawer = null; S.page = 'sale'; render(); },
  'drawer-receive'() { const pid = S.drawer.pid; S.drawer = null; startReceive(pid, null, null); },
  'unit-add'() { const d = S.drawer.draft; const last = d.units[d.units.length - 1]; d.units.push({ name: '', size: (Number(last && last.size) || 1) * 10, price: '' }); render(); },
  'unit-remove'(el) { S.drawer.draft.units.splice(+el.dataset.i, 1); render(); },
  'code-add'() { const d = S.drawer.draft; d.codes.push({ code: '', unit: d.units[0].name }); render(); const el = document.getElementById('pc-c-' + (d.codes.length - 1)); if (el) el.focus(); },
  'code-remove'(el) { S.drawer.draft.codes.splice(+el.dataset.i, 1); render(); },
  'code-gen'() { const d = S.drawer.draft; d.codes.push({ code: newStoreCode(), unit: (d.units[1] || d.units[0]).name }); render(); },
  'save-product'() { safe(saveProduct); },
  'delete-product'() { safe(async () => { const pid = S.drawer.pid; const name = S.products[pid].name; await Store.del('products', pid); S.drawer = null; toast(`ลบ ${name} แล้ว`); render(); }); },
  'basket-step'(el) { const ln = S.basket[+el.dataset.i]; ln.qty = Math.max(1, ln.qty + +el.dataset.d); render(); },
  'basket-remove'(el) { S.basket.splice(+el.dataset.i, 1); render(); },
  'basket-clear'() { S.basket = []; S.saleNote = ''; render(); },
  'commit-sale'() { safe(commitSale); },
  'void-bill'(el) { S.modal = { kind: 'void', bill: el.dataset.bill }; render(); },
  'void-confirm'() { safe(async () => { const bill = S.modal.bill; const at = new Date().toISOString();
    const entries = D.moves.filter(m => m.bill === bill && m.type === 'sale').map(m => ({ id: uid('m'), at, type: 'void', pid: m.pid, lotId: m.lotId, qty: -m.qty, unit: m.unit, unitQty: m.unitQty, unitPrice: m.unitPrice, amount: m.amount, bill, note: 'ยกเลิกบิล ' + bill }));
    await record(entries); S.modal = null; toast(`ยกเลิกบิล ${bill} แล้ว ยาคืนเข้าคลัง`); render(); }); },
  'receive-clear'() { S.receive.pid = null; S.receive.fromScan = false; render(); $('#scanInput').focus(); },
  'receive-kind'(el) { S.receive.kind = el.dataset.kind; render(); },
  'commit-receive'() { safe(commitReceive); },
  'stock-status'(el) { S.stock.status = el.dataset.s; render(); },
  'lot-adjust'(el) { const p = S.products[S.drawer.pid]; const l = lotsOf(S.drawer.pid).find(x => x.id === el.dataset.lot); const u = unitsOf(p)[0];
    S.modal = { kind: 'adjust', pid: S.drawer.pid, lotId: l.id, qty: l.qty, unit: u.name, note: '' }; render(); const i = $('#md-qty'); if (i) i.select(); },
  'lot-dispose'(el) { const p = S.products[S.drawer.pid]; const l = lotsOf(S.drawer.pid).find(x => x.id === el.dataset.lot);
    S.modal = { kind: 'dispose', pid: S.drawer.pid, lotId: l.id, qty: l.qty, unit: unitsOf(p)[0].name, note: daysLeft(l.exp) < 0 ? 'หมดอายุ' : 'เสื่อมสภาพ / เสียหาย' }; render(); },
  'adjust-save'() { safe(async () => { const m = S.modal; const p = S.products[m.pid]; const l = lotsOf(m.pid).find(x => x.id === m.lotId); const u = unitByName(p, m.unit);
    if (m.qty === '' || !(Number(m.qty) >= 0)) return toast('ใส่จำนวนที่นับได้', 'err');
    const diff = Number(m.qty) * u.size - l.qty; if (!diff) { S.modal = null; render(); return toast('ยอดตรงกับในระบบ ไม่ได้บันทึกเพิ่ม'); }
    await record([{ id: uid('m'), at: new Date().toISOString(), type: 'adjust', pid: m.pid, lotId: m.lotId, qty: diff, unit: unitsOf(p)[0].name, unitQty: diff, unitPrice: 0, amount: 0, note: m.note || 'นับสต็อก' }]);
    S.modal = null; toast('ปรับยอดแล้ว'); render(); }); },
  'dispose-save'() { safe(async () => { const m = S.modal; const p = S.products[m.pid]; const l = lotsOf(m.pid).find(x => x.id === m.lotId); const u = unitByName(p, m.unit);
    const base = Number(m.qty) * u.size; if (!(base > 0)) return toast('ใส่จำนวนที่ตัดทิ้ง', 'err'); if (base > l.qty) return toast(`ล็อตนี้เหลือแค่ ${fmtQty(p, l.qty)}`, 'err');
    await record([{ id: uid('m'), at: new Date().toISOString(), type: 'dispose', pid: m.pid, lotId: m.lotId, qty: -base, unit: u.name, unitQty: Number(m.qty), unitPrice: 0, amount: 0, note: m.note }]);
    S.modal = null; toast('ตัดออกจากคลังแล้ว'); render(); }); },
  'modal-close'() { S.modal = null; render(); },
  label() { S.modal = { kind: 'label', pid: S.drawer.pid, code: null }; render(); },
  'print-label'() { try { window.print(); } catch (e) { toast('หน้านี้สั่งพิมพ์ไม่ได้ — ถ่ายหน้าจอบาร์โค้ดไปพิมพ์แทน', 'err'); } },
  'camera-open'() { openCamera(); },
  'camera-close'() { closeCamera(); },
  'suggest-pick'(el) { $('#scanInput').value = ''; hideSuggest(); actOnProduct(el.dataset.pid, null, null); },
  'demo-scan'(el) { const d = S.meta.demo.codes[+el.dataset.i]; handleScan(d.code.split('<GS>').join(GS)); },
  'save-settings'() { safe(async () => { const shopName = $('#set-shop').value.trim() || 'ร้านยาของฉัน'; const nearDays = Math.min(720, Math.max(7, Number($('#set-near').value) || 90));
    await Store.set('meta', 'settings', { shopName, nearDays }); toast('บันทึกการตั้งค่าแล้ว'); }); },
  'export-csv'() { exportCSV(ledgerRows(), `ประวัติยา_${S.lg.from || 'ทั้งหมด'}_${S.lg.to || todayKey()}.csv`); },
  'export-csv-all'() { exportCSV(D.moves, `ประวัติยา_ทั้งหมด_${todayKey()}.csv`); },
  'export-json'() { saveFile(`สมุดคลังยา_สำรอง_${todayKey()}.json`, JSON.stringify({ app: 'samut-khlang-ya', version: 1, exportedAt: new Date().toISOString(), products: S.products, moves: S.days, meta: { settings: S.meta.settings || null } }, null, 1), 'application/json'); },
  'import-json'() { $('#importInput').click(); },
  'import-confirm'() { safe(async () => { const data = S.modal.data;
    for (const [id, p] of Object.entries(data.products || {})) await Store.set('products', id, p);
    for (const [id, dd] of Object.entries(data.moves || {})) await Store.set('moves', id, dd);
    if (data.meta && data.meta.settings) await Store.set('meta', 'settings', data.meta.settings);
    if (data.meta && data.meta.demo) await Store.set('meta', 'demo', data.meta.demo);
    S.modal = null; toast('นำเข้าข้อมูลแล้ว'); render(); }); },
  'sign-out'() { if (Store && Store.signOut) Store.signOut(); },
  tour() { startTour(); },
  'tour-next'() { tourI++; if (tourI >= TOUR.length) endTour(); else drawTour(); },
  'tour-prev'() { tourI = Math.max(0, tourI - 1); drawTour(); },
  'tour-skip'() { endTour(); },
  torch() { if (!camCaps) return; const t = camCaps.torchFeature(); const on = !t.value(); t.apply(on).then(() => { $('#torchBtn').textContent = on ? 'ปิดไฟฉาย' : 'ไฟฉาย'; }).catch(() => toast('เปิดไฟฉายไม่ได้บนกล้องนี้', 'err')); },
  'onboard-hide'() { lsSet('khlangya:onboard-hidden', '1'); render(); },
  'onboard-show'() { try { localStorage.removeItem('khlangya:onboard-hidden'); } catch (e) { /* storage blocked */ } S.page = 'home'; render(); },
  'onboard-opening'() { S.receive.kind = 'opening'; S.page = 'receive'; render(); $('#scanInput').focus(); },
  'load-sample'() {
    fetch('sample/sample-backup.json').then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(data => { S.modal = { kind: 'import', data }; render(); })
      .catch(() => toast('โหลดข้อมูลตัวอย่างไม่ได้ในหน้านี้', 'err'));
  },
  'clear-sample'() { S.modal = { kind: 'clear-sample' }; render(); },
  'clear-sample-confirm'() { safe(async () => {
    const samplePids = new Set(Object.keys(S.products).filter(id => S.products[id].sample));
    for (const [id, dd] of Object.entries(S.days)) {
      const keep = Object.fromEntries(Object.entries(dd.entries || {}).filter(([, e]) => !e.sample && !samplePids.has(e.pid)));
      if (!Object.keys(keep).length) await Store.del('moves', id);
      else if (Object.keys(keep).length !== Object.keys(dd.entries || {}).length) await Store.set('moves', id, { date: dd.date || id, entries: keep });
    }
    for (const [id, p] of Object.entries(S.products)) if (p.sample) await Store.del('products', id);
    if (S.meta.demo) await Store.del('meta', 'demo');
    S.basket = S.basket.filter(b => S.products[b.pid] && !S.products[b.pid].sample);
    S.modal = null; S.drawer = null; toast('ลบข้อมูลตัวอย่างแล้ว — เริ่มสแกนยาจริงได้เลย'); render(); }); },
};
const CHANGE = {
  rerender() { render(); },
  'basket-unit'(el) { S.basket[+el.dataset.i].unit = el.value; render(); },
  'basket-qty'(el) { S.basket[+el.dataset.i].qty = Math.max(1, Math.floor(Number(el.value) || 1)); render(); },
  'receive-lot'(el) { const p = S.products[S.receive.pid]; const v = el.value.trim().toUpperCase(); const l = p && Object.values(p.lots || {}).find(x => x.lot.toUpperCase() === v);
    if (l && !S.receive.exp) { S.receive.exp = l.exp; render(); } },
};
function setPath(path, value) { const ks = path.split('.'); let o = S; while (ks.length > 1) o = o[ks.shift()]; o[ks[0]] = value; }

document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]'); if (!el) return;
  const fn = A[el.dataset.action]; if (!fn) return;
  if (el.tagName === 'BUTTON' || el.tagName === 'A') e.preventDefault();
  fn(el, e);
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'scanInput') { showSuggest(); return; }
  if (el.id === 'zoomRange') { const v = Number(el.value); $('#zoomVal').textContent = trimNum(v) + '×'; if (camCaps) camCaps.zoomFeature().apply(v).catch(() => {}); return; }
  if (el.dataset.bind) { setPath(el.dataset.bind, el.value); if (el.dataset.inputRender !== undefined) render(); if (el.dataset.live) { const R = S.receive; const p = S.products[R.pid]; const box = document.getElementById(el.dataset.live); if (p && box) { const u = unitByName(p, R.unit); const qn = Number(R.qty) || 0; box.textContent = qn > 0 ? `= ${fmtQty(p, qn * u.size)} · ทุนรวม ${baht(qn * (Number(R.cost) || 0))}` : 'ใส่จำนวนที่รับ'; } } }
  if (el.dataset.draft) S.drawer.draft[el.dataset.draft] = el.value;
  if (el.dataset.unit) { const [i, k] = el.dataset.unit.split(':'); S.drawer.draft.units[+i][k] = el.value; }
  if (el.dataset.code) { const [i, k] = el.dataset.code.split(':'); S.drawer.draft.codes[+i][k] = el.value; }
  if (el.dataset.modal) { S.modal[el.dataset.modal] = el.value; const box = $('#md-diff'); if (box && S.modal.kind === 'adjust') box.innerHTML = adjustDiffText(S.modal); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'photoInput') { scanPhoto(el.files[0]); el.value = ''; return; }
  if (el.id === 'camSelect') { lsSet('khlangya:camera', el.value); startCamera(); return; }
  if (el.id === 'zoomRange') return;
  if (el.id === 'importInput') { const f = el.files[0]; el.value = ''; if (!f) return;
    f.text().then(t => { const data = JSON.parse(t); if (!data || data.app !== 'samut-khlang-ya') throw new Error('bad'); S.modal = { kind: 'import', data }; render(); })
      .catch(() => toast('ไฟล์นี้ไม่ใช่ไฟล์สำรองของสมุดคลังยา', 'err')); return; }
  if (el.dataset.bind) setPath(el.dataset.bind, el.value);
  if (el.dataset.draft) { S.drawer.draft[el.dataset.draft] = el.value; }
  if (el.dataset.unit) { const [i, k] = el.dataset.unit.split(':'); S.drawer.draft.units[+i][k] = el.value; if (k === 'name') render(); }
  if (el.dataset.code) { const [i, k] = el.dataset.code.split(':'); S.drawer.draft.codes[+i][k] = el.value; }
  if (el.dataset.modal) { S.modal[el.dataset.modal] = el.value; if (el.dataset.rerender !== undefined || el.tagName === 'SELECT') render(); }
  if (el.dataset.change && CHANGE[el.dataset.change]) CHANGE[el.dataset.change](el);
});
$('#scanForm').addEventListener('submit', e => {
  e.preventDefault();
  const inp = $('#scanInput'); const v = inp.value;
  if (S.suggest.length && !parseScan(v)) { const pid = S.suggest[S.suggestSel] || S.suggest[0]; inp.value = ''; hideSuggest(); actOnProduct(pid, null, null); return; }
  inp.value = ''; handleScan(v);
});
$('#scanInput').addEventListener('keydown', e => {
  if (!S.suggest.length) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault(); S.suggestSel = (S.suggestSel + (e.key === 'ArrowDown' ? 1 : -1) + S.suggest.length) % S.suggest.length;
    [...$('#suggest').children].forEach((b, i) => b.classList.toggle('sel', i === S.suggestSel));
  } else if (e.key === 'Escape') hideSuggest();
});
$('#scanInput').addEventListener('blur', () => setTimeout(hideSuggest, 180));
document.addEventListener('keydown', e => {
  if (tourI >= 0) { if (e.key === 'Escape') endTour(); else if (e.key === 'ArrowRight') A['tour-next'](); else if (e.key === 'ArrowLeft') A['tour-prev'](); return; }
  if (e.key === 'Escape') { if (!$('#camera').hidden) closeCamera(); else if (S.modal) { S.modal = null; render(); } else if (S.drawer) { S.drawer = null; render(); } return; }
  if (e.key === 'Enter' && e.target.matches && e.target.matches('tr[data-action]')) { e.target.click(); return; }
  const t = e.target;
  if (t.closest && t.closest('input,textarea,select,[contenteditable]')) return;
  if (e.ctrlKey || e.metaKey || e.altKey || S.modal || !$('#camera').hidden) return;
  if (e.key.length === 1) $('#scanInput').focus();
});

/* ================= boot ================= */
(async function boot() {
  const d14 = new Date(); d14.setDate(d14.getDate() - 13); S.lg.from = dayKey(d14); S.lg.to = todayKey();
  render();
  const cfg = window.KHLANGYA_CONFIG;
  if (cfg && cfg.firebase && cfg.firebase.apiKey) {
    try { Store = await firebaseStore(cfg); }
    catch (e) { showGate(`<h2>เชื่อมต่อฐานข้อมูลไม่ได้</h2><p>${esc(e.message || e)} — ตรวจอินเทอร์เน็ตแล้วรีโหลดหน้า</p><button class="btn primary" onclick="location.reload()">รีโหลด</button>`); return; }
    if (!Store) return;
  } else {
    const db = await getCap('db');
    Store = db ? dbStore(db) : localStore();
  }
  $('#storeDot').classList.add('on');
  $('#storeText').innerHTML = Store.kind === 'firebase'
    ? `ซิงก์กับ Firebase<br><span class="mono" style="word-break:break-all">${esc(Store.email)}</span><br><button class="linkbtn" data-action="sign-out">ออกจากระบบ</button>`
    : Store.kind === 'db' ? 'ซิงก์ข้อมูลข้ามอุปกรณ์' : 'เก็บข้อมูลในเบราว์เซอร์นี้';
  const maybeTour = () => { if (S.ready.products && S.ready.moves && !maybeTour.done) { maybeTour.done = true; if (!lsGet('khlangya:tour-done')) setTimeout(startTour, 500); } };
  Store.watch('products', data => { S.products = data; S.ready.products = true; compute(); render(); maybeTour(); });
  Store.watch('moves', data => { S.days = data; S.ready.moves = true; compute(); render(); maybeTour(); });
  window.addEventListener('resize', () => { if (tourI >= 0) drawTour(); });
  Store.watch('meta', data => { S.meta = data; render(); });
})();
})();
</script>
